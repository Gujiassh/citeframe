[project]
name = "citeframe-backend-persistence"
version = "0.1.0"
description = "Neutral SQLAlchemy base and ORM mappings shared by Citeframe backends"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.41",
  "pgvector>=0.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citeframe_persistence"]
