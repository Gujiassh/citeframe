[project]
name = "citeframe-memory-service"
version = "0.1.0"
description = "Neutral owner-private memory use cases and provider adapters"
requires-python = ">=3.12"
dependencies = ["citeframe-backend-contracts", "citeframe-backend-persistence"]

[tool.uv.sources]
citeframe-backend-contracts = { path = "../backend-contracts", editable = true }
citeframe-backend-persistence = { path = "../backend-persistence", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citeframe_memory"]
