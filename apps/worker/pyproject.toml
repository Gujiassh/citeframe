[project]
name = "ai-pdf-worker"
version = "0.1.0"
description = "Background worker for Citeframe"
requires-python = ">=3.12"
dependencies = [
  "ai-pdf-api",
  "numpy>=1.26.0",
  "pillow>=12.3.0",
  "pypdf>=5.8.0",
  "pymupdf>=1.28.0",
  "rapidocr-onnxruntime>=1.4.4",
  "langgraph>=1.0,<2.0",
  "markdown-it-py>=3.0.0",
  "citeframe-backend-contracts",
  "citeframe-backend-persistence",
  "citeframe-research-persistence",
]

[tool.uv.sources]
ai-pdf-api = { path = "../api", editable = true }
citeframe-backend-contracts = { path = "../../packages/backend-contracts", editable = true }
citeframe-backend-persistence = { path = "../../packages/backend-persistence", editable = true }
citeframe-research-persistence = { path = "../../packages/research-persistence", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
markers = [
    "acceptance: cross-layer or production-workflow acceptance checks",
    "evaluation: model/evaluation campaign and quality-gate checks",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pdf_worker"]
