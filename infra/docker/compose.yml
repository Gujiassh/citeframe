services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-pdf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_pdf_workspace
      POSTGRES_USER: ai_pdf
      POSTGRES_PASSWORD: ai_pdf_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-pdf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:latest
    container_name: ai-pdf-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - ./data/minio:/data

volumes:
  postgres_data:
  redis_data:
