name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_pdf_workspace
          POSTGRES_USER: ai_pdf
          POSTGRES_PASSWORD: ai_pdf_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_pdf -d ai_pdf_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_PDF_DATABASE_URL: postgresql+psycopg://ai_pdf:ai_pdf_dev@127.0.0.1:5432/ai_pdf_workspace
      AI_PDF_API_INTERNAL_TOKEN: ci-internal-token-please-change
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Check API and Worker locks
        run: |
          uv lock --project apps/api --check
          uv lock --project apps/worker --check
          uv lock --project tools/evaluation --check
      - name: Run A2a deploy supply-chain and final-image gate
        run: bash infra/scripts/a2a-deploy-gate.sh
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: uv sync --project apps/api --frozen --extra dev
      - run: uv run --project apps/api python -c 'import citeframe_contracts, citeframe_persistence, citeframe_research_persistence; print("backend-contracts-persistence-research-import-smoke=pass")'
      - run: uv run --project apps/api pytest apps/api/tests
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini check

  worker-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - run: uv lock --project apps/worker --check
      - run: uv sync --project apps/worker --frozen --dev
      - run: uv run --project apps/worker python -c 'import citeframe_contracts, citeframe_persistence, citeframe_research_persistence; print("backend-contracts-persistence-research-import-smoke=pass")'
      - run: >-
          uv run --project apps/worker pytest --strict-markers
          -m "not acceptance and not evaluation" apps/worker/tests
      - run: uv run --project apps/worker python -m compileall -q apps/worker/src apps/worker/tests

  worker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - run: uv lock --project apps/worker --check
      - run: uv sync --project apps/worker --frozen --dev
      - run: >-
          uv run --project apps/worker pytest --strict-markers
          -m acceptance apps/worker/tests

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/evaluation/uv.lock
      - run: uv lock --project tools/evaluation --check
      - run: uv sync --project tools/evaluation --frozen --dev
      - run: uv run --project tools/evaluation pytest --strict-markers tools/evaluation/tests
      - run: uv build --project apps/worker
      - run: uv build --project tools/evaluation
      - run: uv run --project tools/evaluation citeframe-evaluate --help
      - run: uv run --project tools/evaluation citeframe-campaign --help
      - run: uv run --project tools/evaluation citeframe-research-acceptance --help
      - name: Build isolated evaluation image and check packaged entry points
        run: |
          docker build --target evaluation --file infra/docker/Dockerfile.python --tag citeframe-evaluation:ci .
          docker run --rm citeframe-evaluation:ci python -m citeframe_evaluation.cli.paired --help
          docker run --rm citeframe-evaluation:ci python -m citeframe_evaluation.cli.campaign --help
          docker run --rm citeframe-evaluation:ci python -m citeframe_evaluation.acceptance.cli --help
          docker run --rm citeframe-evaluation:ci python -c 'from citeframe_evaluation.contracts import load_evaluation_package; assert len(load_evaluation_package().cases) == 6'


  web:
    runs-on: ubuntu-latest
    env:
      AI_PDF_SESSION_SECRET: ci-session-secret-please-change
      AI_PDF_API_INTERNAL_TOKEN: ci-internal-token-please-change
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --dir apps/web build

  web-e2e:
    runs-on: ubuntu-latest
    env:
      AI_PDF_SESSION_SECRET: ci-session-secret-please-change
      AI_PDF_API_INTERNAL_TOKEN: ci-internal-token-please-change
      PLAYWRIGHT_START_WEB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web e2e
