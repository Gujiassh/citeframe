name: Memory history and image contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pure-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install frozen API environment
        run: uv sync --project apps/api --frozen --extra dev
      - name: Run exact checkout-local pure contracts without skips
        run: |
          uv run --project apps/api --frozen --no-sync python - <<'PY'
          from collections import Counter
          import importlib
          import os
          from pathlib import Path
          import pytest

          root = Path.cwd().resolve()
          if os.environ.get("CITEFRAME_HISTORY43_SOURCE_ROOT"):
              raise RuntimeError("sibling_dependency_forbidden")
          if os.environ.get("PYTEST_ADDOPTS"):
              raise RuntimeError("pytest_options_override_forbidden")
          modules = {
              "citeframe_contracts.memory": "packages/backend-contracts/src/citeframe_contracts/memory.py",
              "citeframe_contracts.compaction": "packages/backend-contracts/src/citeframe_contracts/compaction.py",
              "citeframe_contracts.history": "packages/backend-contracts/src/citeframe_contracts/history.py",
              "citeframe_memory.compaction": "packages/memory-service/src/citeframe_memory/compaction/__init__.py",
              "citeframe_memory.compaction.policy": "packages/memory-service/src/citeframe_memory/compaction/policy.py",
              "citeframe_memory.history.ranges": "packages/memory-service/src/citeframe_memory/history/ranges.py",
              "citeframe_memory.history.search": "packages/memory-service/src/citeframe_memory/history/search.py",
          }

          def check_imports():
              for name, relative in modules.items():
                  module = importlib.import_module(name)
                  if Path(module.__file__).resolve() != root / relative:
                      raise RuntimeError("non_checkout_import:" + name)
                  print("checkout-import=" + name + ":" + relative)

          expected = {
              "packages/memory-service/tests/test_history_sources.py": 42,
              "packages/memory-service/tests/test_generation_image_contract.py": 59,
          }
          for path in expected:
              if not (root / path).is_file():
                  raise RuntimeError("missing_contract_test:" + path)
          check_imports()

          class ExactRun:
              def __init__(self):
                  self.collected = set()
                  self.phases = {}
                  self.bad = []

              def pytest_collection_finish(self, session):
                  counts = Counter(item.nodeid.split("::", 1)[0] for item in session.items)
                  if dict(counts) != expected:
                      raise pytest.UsageError("contract_collection_mismatch:" + repr(dict(counts)))
                  self.collected = {item.nodeid for item in session.items}
                  if len(self.collected) != sum(expected.values()):
                      raise pytest.UsageError("duplicate_contract_nodeids")
                  if any(item.get_closest_marker(mark) for item in session.items
                         for mark in ("skip", "skipif", "xfail")):
                      raise pytest.UsageError("contract_skip_or_xfail_marker_forbidden")

              def pytest_runtest_logreport(self, report):
                  self.phases.setdefault(report.nodeid, []).append((report.when, report.outcome))
                  if report.outcome != "passed" or hasattr(report, "wasxfail"):
                      self.bad.append(report.nodeid + ":" + report.when + ":" + report.outcome)

              def pytest_sessionfinish(self, session, exitstatus):
                  full = [("setup", "passed"), ("call", "passed"), ("teardown", "passed")]
                  if (exitstatus != 0 or self.bad or not self.collected
                          or set(self.phases) != self.collected
                          or any(phases != full for phases in self.phases.values())):
                      session.exitstatus = pytest.ExitCode.TESTS_FAILED

          gate = ExactRun()
          status = pytest.main(["-q", "--strict-markers", "-p", "no:cacheprovider", *expected], plugins=[gate])
          check_imports()
          if status != 0:
              raise SystemExit(status)
          print("pure-contracts-executed=101; history=42; generation-image=59; skipped=0; xfailed=0")
          PY
