name: R800 deployment script smoke

on:
  pull_request:
    paths:
      - 'infra/testing/r800_docker_*.py'
      - 'infra/testing/r800_provider_proofs.py'
      - 'infra/testing/r800_product_delta.py'
      - 'infra/testing/test_r800_product_delta.py'
      - 'specs/v5/worker-layout/integrated-product-delta.json'
      - 'infra/testing/test_r800_docker_smoke.py'
      - '.github/workflows/r800-deployment.yml'
      - 'infra/docker/**'
      - 'infra/scripts/*deployment.sh'
      - 'infra/scripts/compose-common.sh'
      - 'tools/evaluation/**'
      - 'apps/worker/**'

permissions:
  contents: read

jobs:
  r800-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: product
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 50af19dc3b79fbb677d9ac66c005b77cbe76f3d9
          path: baseline
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          enable-cache: true
          cache-dependency-glob: product/tools/evaluation/uv.lock
      - name: Replay three Hubble false positives before service smoke
        working-directory: product
        run: |
          uv sync --project tools/evaluation --frozen --dev
          uv run --project tools/evaluation pytest tools/evaluation/tests/test_acceptance_evidence_links.py -k hubble -v
          uv run --project tools/evaluation python -m unittest discover -s infra/testing -p test_r800_product_delta.py -v
          uv run --project tools/evaluation pytest apps/api/tests/test_storage_deadline_admission.py apps/api/tests/test_research_publication_adoption.py apps/api/tests/test_research_recovered_step_error.py -q
      - name: Verify current feature contracts without human policy substitution
        working-directory: product
        run: |
          uv run --project tools/evaluation pytest apps/api/tests/test_research_autonomy.py apps/api/tests/test_research_policy_publication.py apps/api/tests/test_research_adaptive_recovery.py apps/api/tests/test_research_adaptive_service.py apps/api/tests/test_research_report_edit.py -q
          uv run --project tools/evaluation pytest tools/evaluation/tests/test_acceptance_evidence_links.py tools/evaluation/tests/test_acceptance_scenario_drivers.py -q
      - name: Use the runner's existing Compose v2 through the scripts' CLI name
        run: |
          docker version
          docker compose version
          mkdir -p "$RUNNER_TEMP/r800-bin"
          printf '#!/usr/bin/env bash\nexec docker compose "$@"\n' > "$RUNNER_TEMP/r800-bin/docker-compose"
          chmod +x "$RUNNER_TEMP/r800-bin/docker-compose"
          echo "$RUNNER_TEMP/r800-bin" >> "$GITHUB_PATH"
      - name: Historical scenarios on the same runner and pinned services
        run: python3 harness/infra/testing/r800_docker_smoke.py --source baseline --output "$RUNNER_TEMP/r800-baseline" --historical-scenarios-only
      - name: Exact PR SHA with recorded baseline product delta
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s harness/infra/testing -p test_r800_docker_smoke.py -v
          python3 harness/infra/testing/r800_docker_smoke.py --source product --output "$RUNNER_TEMP/r800-evidence"
      - name: Actual forced-serial negative control in a fresh isolated project
        if: ${{ !cancelled() }}
        run: python3 harness/infra/testing/r800_docker_smoke.py --source product --output "$RUNNER_TEMP/r800-serial" --serial-negative-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r800-deployment-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/r800-evidence/*.json
            ${{ runner.temp }}/r800-evidence/*.out
            ${{ runner.temp }}/r800-evidence/*.err
            ${{ runner.temp }}/r800-evidence/*.txt
            ${{ runner.temp }}/r800-evidence/backup/SHA256SUMS
            ${{ runner.temp }}/r800-evidence/backup/manifest.env
            ${{ runner.temp }}/r800-baseline/*.json
            ${{ runner.temp }}/r800-baseline/*.out
            ${{ runner.temp }}/r800-baseline/*.err
            ${{ runner.temp }}/r800-baseline/*.txt
            ${{ runner.temp }}/r800-serial/*.json
            ${{ runner.temp }}/r800-serial/*.out
            ${{ runner.temp }}/r800-serial/*.err
            ${{ runner.temp }}/r800-serial/*.txt
