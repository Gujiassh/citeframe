name: Chat runtime profile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pure-chat-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: ${{ github.workspace }}/apps/api/src:${{ github.workspace }}/packages/memory-service/src:${{ github.workspace }}/packages/backend-contracts/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --project apps/api --frozen --extra dev
      - name: Test isolated pure chat profile binding
        run: |
          uv run --project apps/api --frozen --no-sync python - <<'PY'
          import importlib.abc
          import pathlib
          import socket
          import sys

          allowed_api = {
              "ai_pdf_api",
              "ai_pdf_api.services",
              "ai_pdf_api.services.chat_runtime_profile",
              "ai_pdf_api.services.model_config_types",
          }

          def forbidden_application(name):
              root = name.split(".", 1)[0]
              return root == "ai_pdf_worker" or (root == "ai_pdf_api" and name not in allowed_api)

          class PureProfileImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if forbidden_application(fullname):
                      raise AssertionError("application import forbidden: " + fullname)

          def deny_network(*args, **kwargs):
              raise AssertionError("chat profile tests forbid sockets and DNS")

          sys.meta_path.insert(0, PureProfileImports())
          socket.socket = deny_network
          socket.create_connection = deny_network
          socket.socketpair = deny_network
          for name in ("getaddrinfo", "gethostbyname", "gethostbyname_ex", "gethostbyaddr", "getnameinfo"):
              setattr(socket, name, deny_network)

          import citeframe_contracts.memory as contract
          import pytest

          expected = pathlib.Path("packages/backend-contracts/src/citeframe_contracts/memory.py").resolve()
          assert pathlib.Path(contract.__file__).resolve() == expected
          test_path = "apps/api/tests/test_chat_runtime_profile.py"
          if not pathlib.Path(test_path).is_file():
              raise SystemExit("required chat profile test file is missing")

          class RequireExecutedTests:
              def __init__(self):
                  self.skipped = False
                  self.deselected = False
                  self.xfailed = False
                  self.passed_calls = 0

              def pytest_collectreport(self, report):
                  self.skipped |= report.skipped

              def pytest_runtest_logreport(self, report):
                  self.skipped |= report.skipped
                  self.xfailed |= hasattr(report, "wasxfail")
                  if report.when == "call" and report.passed:
                      self.passed_calls += 1

              def pytest_deselected(self, items):
                  self.deselected |= bool(items)

              def pytest_sessionfinish(self, session, exitstatus):
                  if (self.skipped or self.deselected or self.xfailed
                          or session.testscollected != 183 or self.passed_calls != 183):
                      session.exitstatus = 1

          status = pytest.main([
              "--noconftest", "--strict-markers", "-p", "no:cacheprovider",
              "-o", "pythonpath=", "-o", "xfail_strict=true", "-q",
              test_path,
          ], plugins=[RequireExecutedTests()])
          profile_module = sys.modules["ai_pdf_api.services.chat_runtime_profile"]
          expected_profile = pathlib.Path("apps/api/src/ai_pdf_api/services/chat_runtime_profile.py").resolve()
          assert pathlib.Path(profile_module.__file__).resolve() == expected_profile
          assert not any(forbidden_application(name) for name in sys.modules)
          raise SystemExit(status)
          PY
