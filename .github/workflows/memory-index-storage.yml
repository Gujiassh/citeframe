name: Memory index storage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  index-storage-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: citeframe_history42_index_test
          POSTGRES_USER: index42
          POSTGRES_PASSWORD: index42_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U index42 -d citeframe_history42_index_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CITEFRAME_HISTORY42_INDEX_POSTGRES_URL: postgresql+psycopg://index42:index42_ci_only@127.0.0.1:5432/citeframe_history42_index_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install frozen API environment
        run: uv sync --project apps/api --frozen --extra dev
      - name: Execute every index storage oracle without skips
        run: |
          uv run --project apps/api --frozen --no-sync python - <<'PY'
          import importlib
          import os
          from pathlib import Path
          import sys
          import pytest

          root = Path.cwd().resolve()
          if os.environ.get("PYTEST_ADDOPTS"):
              raise RuntimeError("pytest_options_override_forbidden")
          for relative in ("packages/backend-contracts/src", "packages/backend-persistence/src",
                           "packages/research-persistence/src", "packages/memory-service/src"):
              sys.path.insert(0, str(root / relative))
          modules = {
              "citeframe_persistence.base": "packages/backend-persistence/src/citeframe_persistence/base.py",
              "citeframe_persistence.models.memory": "packages/backend-persistence/src/citeframe_persistence/models/memory.py",
              "citeframe_persistence.models.memory_index": "packages/backend-persistence/src/citeframe_persistence/models/memory_index.py",
          }

          def check_imports():
              for name, relative in modules.items():
                  if Path(importlib.import_module(name).__file__).resolve() != root / relative:
                      raise RuntimeError("non_checkout_import:" + name)

          class ExactRun:
              def __init__(self):
                  self.collected = set()
                  self.phases = {}
                  self.bad = []

              def pytest_collection_finish(self, session):
                  self.collected = {item.nodeid for item in session.items}
                  if len(session.items) != 156 or len(self.collected) != 156:
                      raise pytest.UsageError("index_storage_collection_mismatch")
                  if any(item.get_closest_marker(mark) for item in session.items
                         for mark in ("skip", "skipif", "xfail")):
                      raise pytest.UsageError("index_storage_skip_or_xfail_forbidden")

              def pytest_runtest_logreport(self, report):
                  self.phases.setdefault(report.nodeid, []).append((report.when, report.outcome))
                  if report.outcome != "passed" or hasattr(report, "wasxfail"):
                      self.bad.append(report.nodeid)

              def pytest_sessionfinish(self, session, exitstatus):
                  complete = [("setup", "passed"), ("call", "passed"), ("teardown", "passed")]
                  if (exitstatus != 0 or self.bad or not self.collected
                          or set(self.phases) != self.collected
                          or any(phases != complete for phases in self.phases.values())):
                      session.exitstatus = pytest.ExitCode.TESTS_FAILED

          check_imports()
          status = pytest.main(["-q", "--strict-markers", "-p", "no:cacheprovider",
                                "packages/memory-service/tests/test_history_index_postgres.py"],
                               plugins=[ExactRun()])
          check_imports()
          if status != 0:
              raise SystemExit(status)
          print("index-storage-executed=156; skipped=0; xfailed=0")
          PY
